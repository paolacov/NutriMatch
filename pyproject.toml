[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrimatch"
version = "0.1.0"
description = "Motor determinista y explicable de compatibilidad alimentaria para apoyo a la decisión de compra en México."
readme = "README.md"
requires-python = ">=3.11"
# La licencia del código está PENDIENTE de decidir: ver LICENSE.
dependencies = [
    "httpx",
    "pandas",
    "pyarrow",
    "duckdb",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "rapidfuzz",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    # Gráficos de los notebooks de EDA (02, 03, 08). La interfaz Angular no los usa.
    "plotly",
]

[project.optional-dependencies]
# Capa LLM OPCIONAL: el sistema funciona sin ella con plantillas deterministas.
llm = ["openai"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
# `evaluacion/` vive fuera de `src/` a propósito (ver README, "Mapa de carpetas"): son
# mecanismos de evaluación del motor (golden set, parity-check, diagnóstico de cobertura),
# no lógica de producto reutilizada por la UI. Se instala en editable junto a `nutrimatch`
# para que notebooks y pruebas puedan hacer `import evaluacion...` sin manipular sys.path.
packages = ["src/nutrimatch", "evaluacion"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
